name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run publish in dry-run mode
        required: true
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release
        run: bun run release:check

      - name: Publish packages (dry run)
        if: ${{ inputs.dry_run }}
        run: bun run publish:dry-run

      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          bun run build:publish:packages

          packages=(
            runtime
            core
            tooling
            postgres
            host
            deno
            node
            rest-collections
            otel
            auth
            blobs
            webhooks
            pact
            mesh
            bun
          )

          for package in "${packages[@]}"; do
            package_dir="packages/$package"
            package_name="$(node -p "require('./$package_dir/package.json').name")"
            package_version="$(node -p "require('./$package_dir/package.json').version")"
            package_spec="$package_name@$package_version"

            if npm view "$package_spec" version >/dev/null 2>&1; then
              echo "Skipping $package_spec: already published"
              continue
            fi

            echo "Publishing $package_spec"
            (cd "$package_dir" && npm publish)
          done
