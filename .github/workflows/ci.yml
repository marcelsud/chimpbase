name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Typecheck & Unit Tests
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: node ./scripts/build-package.mjs runtime core tooling postgres host deno node rest-collections otel bun pact auth webhooks

      - name: Typecheck
        run: bun run typecheck

      - name: Unsafe any check
        run: bun run check:any

      - name: Unit tests
        run: bun test

      - name: Check documentation examples
        run: bun run docs:check

      - name: Publish dry-run
        run: bun run publish:dry-run

      - name: Build documentation
        run: bun run docs:build

  postgres:
    name: Postgres Integration
    runs-on: ubuntu-latest
    env:
      CHIMPBASE_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/chimpbase
      NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: chimpbase
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chimpbase"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: node ./scripts/build-package.mjs runtime core tooling postgres host deno node rest-collections otel bun pact auth webhooks

      - name: Postgres integration tests
        run: >-
          bun test tests/listen-event-bus.integration.test.ts tests/mesh.integration.test.ts
          tests/mesh.registry.test.ts tests/postgres.durability.integration.test.ts
          tests/postgres.event-bus.integration.test.ts tests/collections.integration.test.ts
          tests/blobs.test.ts tests/webhooks.test.ts

      - name: Schema sync tests
        run: bun test tests/schema.sync.test.ts

      - name: Deno runtime tests
        run: bun test tests/deno.runtime.test.ts

  docker-images:
    name: Docker (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - bun
          - deno
          - node

    steps:
      - uses: actions/checkout@v4

      - name: Build advanced example
        run: docker build -t chimpbase-ci-${{ matrix.runtime }} -f examples/${{ matrix.runtime }}/advanced/Dockerfile .

      - name: Start PostgreSQL
        run: |
          docker network create chimpbase-ci
          docker run -d --name postgres --network chimpbase-ci \
            -e POSTGRES_DB=chimpbase \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            --health-cmd="pg_isready -U postgres -d chimpbase" \
            --health-interval=1s \
            --health-retries=30 \
            postgres:17-alpine
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs postgres
          exit 1

      - name: Smoke test advanced example
        run: |
          docker run -d --name app --network chimpbase-ci -p 3000:3000 \
            -e CHIMPBASE_BOOTSTRAP_API_KEY=ci-bootstrap-key \
            -e DATABASE_URL=postgres://postgres:postgres@postgres:5432/chimpbase \
            -e PORT=3000 \
            chimpbase-ci-${{ matrix.runtime }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1

      - name: Clean up containers
        if: always()
        run: |
          docker rm -f app postgres 2>/dev/null || true
          docker network rm chimpbase-ci 2>/dev/null || true
